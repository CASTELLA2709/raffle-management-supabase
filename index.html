<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽選管理</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/icon-180.png">
</head>
<body>
<div class="app">
<header class="header">
  <button id="backButton" class="header-btn hidden" aria-label="戻る">‹</button>
  <div class="header-brand">
    <span id="headerIcon" class="header-icon" aria-hidden="true"></span>
    <h1 id="pageTitle">ホーム</h1>
  </div>
  <div class="header-actions">
  <button id="settingsButton" class="header-btn settings-btn" aria-label="設定" onclick="openSettings()">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path class="settings-gear" fill-rule="evenodd" d="M 15.03,7.99 L 15.34,2.61 L 24.66,2.61 L 24.97,7.99 L 29.00,4.41 L 35.59,11.00 L 32.01,15.03 L 37.39,15.34 L 37.39,24.66 L 32.01,24.97 L 35.59,29.00 L 29.00,35.59 L 24.97,32.01 L 24.66,37.39 L 15.34,37.39 L 15.03,32.01 L 11.00,35.59 L 4.41,29.00 L 7.99,24.97 L 2.61,24.66 L 2.61,15.34 L 7.99,15.03 L 4.41,11.00 L 11.00,4.41 L 15.03,7.99 Z M 20,13.5 A 6.5,6.5 0 1 0 20,26.5 A 6.5,6.5 0 1 0 20,13.5 Z"/>
      </svg>
    </button>
  <button id="addButton" class="header-btn add-btn" aria-label="追加">＋</button>
</div>
</header>
<main id="screen"></main>
<nav class="bottom-nav">
  <button data-page="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
    <span>ホーム</span>
  </button>
  <button data-page="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 9h18"/><path d="M7 13h.01M12 13h.01M17 13h.01M7 17h.01M12 17h.01"/></svg>
    <span>カレンダー</span>
  </button>
  <button data-page="events">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 5v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-5v-2Z"/><path d="M10 7.5v9M14 7.5v9"/></svg>
    <span>イベント</span>
  </button>
  <button data-page="products">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
    <span>商品</span>
  </button>
  <button data-page="schedules">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
    <span>予定</span>
  </button>
</nav>
</div>

<div id="addModal" class="overlay hidden">
  <div class="sheet">
    <button class="close" onclick="closeAdd()">×</button>
    <h2>新規登録</h2>
    <button class="add-option" onclick="newEvent()">
      <span class="add-option-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="12" y1="12.5" x2="12" y2="17"/><line x1="9.5" y1="14.75" x2="14.5" y2="14.75"/></svg>
      </span>
      <span class="add-option-text"><strong>イベント</strong><small>ライブ・舞台・コンサートなどのイベントを登録</small></span>
    </button>
    <button class="add-option" onclick="newProduct()">
      <span class="add-option-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
      </span>
      <span class="add-option-text"><strong>POP UP・販売</strong><small>POP UPイベントや受注販売などを登録</small></span>
    </button>
    <button class="add-option" onclick="newSchedule()">
      <span class="add-option-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
      </span>
      <span class="add-option-text"><strong>予定</strong><small>一般的な予定やリマインダーを登録</small></span>
    </button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
